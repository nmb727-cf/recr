components:
  schemas:
    CandidateBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        current_title:
          type: string
          maxLength: 255
        current_location_city:
          type: string
          maxLength: 100
        experience_years:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
      required:
      - first_name
      - id
      - last_name
    CandidateBriefRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        current_title:
          type: string
          maxLength: 255
        current_location_city:
          type: string
          maxLength: 100
        experience_years:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
      required:
      - first_name
      - last_name
    CandidateIdentityCheckRequestRequest:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
    CandidateTalentPoolMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
        talent_pool:
          type: string
          format: uuid
        candidate:
          type: string
          format: uuid
        candidate_details:
          allOf:
          - $ref: '#/components/schemas/CandidateBrief'
          readOnly: true
        added_by:
          type: string
          format: uuid
          nullable: true
        added_at:
          type: string
          format: date-time
          readOnly: true
        source:
          $ref: '#/components/schemas/SourceEnum'
        note:
          type: string
      required:
      - added_at
      - candidate
      - candidate_details
      - id
      - talent_pool
      - tenant_id
    CandidateTalentPoolMembershipRequest:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        talent_pool:
          type: string
          format: uuid
        candidate:
          type: string
          format: uuid
        added_by:
          type: string
          format: uuid
          nullable: true
        source:
          $ref: '#/components/schemas/SourceEnum'
        note:
          type: string
      required:
      - candidate
      - talent_pool
      - tenant_id
    EmailAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
        email_address:
          type: string
          format: email
          maxLength: 254
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        is_default:
          type: boolean
        smtp_host:
          type: string
          maxLength: 255
        smtp_port:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        smtp_username:
          type: string
          maxLength: 255
        smtp_encryption:
          $ref: '#/components/schemas/SmtpEncryptionEnum'
        from_name:
          type: string
          maxLength: 255
        signature:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email_address
      - id
      - provider
      - tenant_id
      - updated_at
      - user_id
    EmailAccountRequest:
      type: object
      properties:
        email_address:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        is_default:
          type: boolean
        smtp_host:
          type: string
          maxLength: 255
        smtp_port:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        smtp_username:
          type: string
          maxLength: 255
        smtp_password:
          type: string
          writeOnly: true
        smtp_encryption:
          $ref: '#/components/schemas/SmtpEncryptionEnum'
        from_name:
          type: string
          maxLength: 255
        signature:
          type: string
        oauth_token:
          writeOnly: true
          nullable: true
        is_active:
          type: boolean
      required:
      - email_address
      - provider
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        tenant_slug:
          type: string
      required:
      - email
      - password
    PaginatedCandidateTalentPoolMembershipList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
