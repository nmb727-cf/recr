        before creating a new user account.

        POST { email, phone } → returns whether a user/candidate already exists so
        the frontend can redirect to login / forgot-password instead of proceeding
        with account creation and creating a duplicate.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateIdentityCheckRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CandidateIdentityCheckRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CandidateIdentityCheckRequestRequest'
      security:
      - {}
      responses:
        '200':
          description: Identity check complete
        '400':
          description: Provide at least an email or phone to check
