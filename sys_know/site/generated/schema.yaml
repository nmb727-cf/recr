components:
  schemas:
    BlankEnum:
      enum:
      - ''
    CandidateBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        current_title:
          type: string
          maxLength: 255
        current_location_city:
          type: string
          maxLength: 100
        experience_years:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
      required:
      - first_name
      - id
      - last_name
    CandidateBriefRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        current_title:
          type: string
          maxLength: 255
        current_location_city:
          type: string
          maxLength: 100
        experience_years:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
      required:
      - first_name
      - last_name
    CandidateIdentityCheckRequestRequest:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
    CandidateTalentPoolMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
        talent_pool:
          type: string
          format: uuid
        candidate:
          type: string
          format: uuid
        candidate_details:
          allOf:
          - $ref: '#/components/schemas/CandidateBrief'
          readOnly: true
        added_by:
          type: string
          format: uuid
          nullable: true
        added_at:
          type: string
          format: date-time
          readOnly: true
        source:
          $ref: '#/components/schemas/SourceEnum'
        note:
          type: string
      required:
      - added_at
      - candidate
      - candidate_details
      - id
      - talent_pool
      - tenant_id
    CandidateTalentPoolMembershipRequest:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
