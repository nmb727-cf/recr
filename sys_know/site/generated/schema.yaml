      description: |-
        Source 2 — Candidate submits the apply form.

        Identity deduplication:
          1. If a user account already exists with the submitted email/phone →
             return needs_login=True so the frontend shows the login screen.
          2. If a candidate record already exists (no user yet) → append the
             submission data but do NOT create a second candidate row.
          3. If neither exists → create candidate + optional user account.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: Success
        '404':
          description: Invalid or expired link.
  /api/v1/candidates/claim/{token}/:
    get:
      operationId: v1_candidates_claim_retrieve
      description: |-
        Validate claim token and return prefilled candidate identity data.
        No authentication required — the candidate may not have an account yet.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: Claim token is valid
        '404':
          description: Invalid or expired claim link
    post:
      operationId: v1_candidates_claim_create
      description: |-
        Link the authenticated user to the candidate record identified by token.
        Must be called after the candidate has signed up or logged in.
        Requires: Authorization header with a valid JWT.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: Profile successfully claimed
        '401':
          description: Authentication required to claim profile
        '404':
          description: Invalid claim token
